# react-router uses client-side routing (BrowserRouter) — a hard refresh on e.g. /incidents/{id}
# would 404 against nginx's default static-file behavior since no such file exists on disk.
# try_files falls back to index.html for any path nginx can't find a real file for, letting
# react-router's own client-side route matching take over from there.
server {
    listen 80;

    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}
